<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="style.css">

</head>
<body>
  <div class="container">
    <div class="img-container">
      <img src="laptop.jpg">
    </div>

    
    <div class="side-container">
      <div class="text">
        <h1>Laptop giveaway</h1>
        <h3>Giveaway ends on Monday, 2 August 2025 11:59 pm</h3>
      </div>

      <div class="details">
      <div class="deadline">
        <div>
          <h4 class="days">35</h4>
          <span>days</span>
        </div>
      </div>

       <div class="deadline">
        <div>
          <h4 class="hours">35</h4>
          <span>hours</span>
        </div>
      </div>

       <div class="deadline">
        <div>
          <h4 class="mins">35</h4>
          <span>mins</span>
        </div>
      </div>

       <div class="deadline">
        <div>
          <h4 class="secs">35</h4>
          <span>secs</span>
        </div>
      </div>

      </div>



    </div>
  </div>

  <script src="app.js"></script>
  
</body>
</html>
